name: Human asset lab

on:
  push:
    branches:
      - agent/human-v2-asset-lab
    paths:
      - .github/workflows/asset-lab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v2-asset-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Acquire free CC0 standard package and inventory models
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/browser research/package
          mkdir -p research/browser research/package
          rm -f /tmp/asset_zip_path
          cat > /tmp/acquire.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, traceback, time

          out=Path('research/browser')
          report=[]
          zip_path=None

          def snapshot(page, stage, filename):
              last=None
              for attempt in range(8):
                  try:
                      page.wait_for_load_state('domcontentloaded', timeout=30000)
                      page.wait_for_timeout(1200)
                      data={
                          'stage':stage,
                          'url':page.url,
                          'title':page.title(),
                          'body':page.locator('body').inner_text(timeout=30000)[:16000],
                          'links':page.locator('a').evaluate_all('(els)=>els.map(e=>({text:(e.innerText||e.textContent||" ").trim(),href:e.href})).filter(x=>x.text||x.href)')
                      }
                      page.screenshot(path=str(out/filename), full_page=True)
                      report.append(data)
                      return data
                  except Exception as exc:
                      last=exc
                      page.wait_for_timeout(1200)
              raise last

          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              context=browser.new_context(accept_downloads=True, viewport={'width':1280,'height':900})
              page=context.new_page()
              try:
                  page.goto('https://quaternius.itch.io/universal-base-characters/purchase', wait_until='domcontentloaded', timeout=120000)
                  snapshot(page,'purchase','01-purchase.png')
                  free=page.get_by_text('No thanks, just take me to the downloads', exact=False)
                  if free.count():
                      free.first.click()
                      page.wait_for_timeout(6000)
                  data=snapshot(page,'downloads','02-downloads.png')
                  target=page.get_by_text('Universal Base Characters[Standard].zip', exact=False)
                  if not target.count():
                      target=page.locator('a').filter(has_text='Standard').first
                  if not target.count():
                      target=page.locator('a[href*="download"]').first
                  report.append({'stage':'target','count':target.count(),'text':target.first.inner_text() if target.count() else ''})
                  if not target.count():
                      raise RuntimeError('No downloadable Standard package link found')
                  with page.expect_download(timeout=120000) as info:
                      target.first.click()
                  download=info.value
                  zip_path=Path('/tmp')/(download.suggested_filename or 'universal-base-characters-standard.zip')
                  download.save_as(str(zip_path))
                  report.append({'stage':'download','filename':zip_path.name,'bytes':zip_path.stat().st_size})
              except Exception as exc:
                  report.append({'stage':'error','error':repr(exc),'traceback':traceback.format_exc(),'url':page.url})
                  try: page.screenshot(path=str(out/'99-error.png'), full_page=True)
                  except Exception: pass
              finally:
                  browser.close()
          Path('research/browser-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if zip_path and zip_path.exists():
              Path('/tmp/asset_zip_path').write_text(str(zip_path))
          PY
          python /tmp/acquire.py
          if [[ -f /tmp/asset_zip_path ]]; then
            ZIP="$(cat /tmp/asset_zip_path)"
            unzip -l "$ZIP" > research/package-inventory.txt
            unzip -q "$ZIP" -d research/package
            find research/package -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.obj' -o -iname '*license*' -o -iname '*readme*' \) -printf '%P\t%s bytes\n' | sort > research/model-inventory.txt
          else
            printf 'DOWNLOAD_NOT_ACQUIRED\n' > research/package-inventory.txt
            : > research/model-inventory.txt
          fi
      - name: Commit audit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/package
          git config user.name 'epaule-3d-asset-lab'
          git config user.email '104558808+stefm78@users.noreply.github.com'
          git add research/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: audit downloadable CC0 human models'
          git push origin HEAD:agent/human-v2-asset-lab
