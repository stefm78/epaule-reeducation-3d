name: Prepare neutral V5 model texture
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v5-clinical-rework.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create softened model texture
        run: |
          python -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          source=Image.open('assets/quaternius/fullbody/T_Superhero_Male_Dark.png').convert('RGB')
          result=source.filter(ImageFilter.GaussianBlur(18))
          result=ImageEnhance.Contrast(result).enhance(.82)
          result=ImageEnhance.Color(result).enhance(.78)
          mask=source.convert('L').point(lambda value: 255 if value < 72 else 0)
          result.paste(source,mask=mask)
          result.save('assets/quaternius/fullbody/T_Neutral_Male.png',optimize=True)
          PY
      - name: Commit texture
        run: |
          git config user.name epaule-v5-asset
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add assets/quaternius/fullbody/T_Neutral_Male.png
          git commit -m 'asset: add neutral model texture'
          git push origin HEAD:agent/human-v4-quaternius
