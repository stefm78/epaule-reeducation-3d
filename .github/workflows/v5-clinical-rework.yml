name: Refine neutral V5 body rendering
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v5-clinical-rework.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Flatten surface detail and reduce athletic proportions
        run: |
          python -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance
          source=Image.open('assets/quaternius/fullbody/T_Superhero_Male_Dark.png').convert('RGB')
          texture=source.filter(ImageFilter.GaussianBlur(36))
          texture=ImageEnhance.Contrast(texture).enhance(.56)
          texture=ImageEnhance.Color(texture).enhance(.52)
          texture=ImageEnhance.Brightness(texture).enhance(1.05)
          texture.save('assets/quaternius/fullbody/T_Neutral_Male.png',optimize=True)
          path=Path('src/app-v4.js')
          text=path.read_text()
          old="const scale=2/height;model.scale.set(scale*.84,scale,scale*.90);"
          new="const scale=2/height;model.scale.set(scale*.70,scale,scale*.80);"
          if old not in text: raise SystemExit('BODY_SCALE_PATTERN_NOT_FOUND')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name epaule-v5-render
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add assets/quaternius/fullbody/T_Neutral_Male.png src/app-v4.js
          git commit -m 'fix: flatten body detail and reduce athletic proportions'
          git push origin HEAD:agent/human-v4-quaternius
