name: Apply neutral V5 body rendering
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v5-clinical-rework.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - name: Apply neutral material and proportions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/app-v4.js')
          text=path.read_text()
          old_loader="function loadModel(){new GLTFLoader().load('assets/quaternius/fullbody/Regular_Male_FullBody.gltf'"
          new_loader="function loadModel(){const neutralTexture=new THREE.TextureLoader().load('assets/quaternius/fullbody/T_Neutral_Male.png');neutralTexture.flipY=false;neutralTexture.colorSpace=THREE.SRGBColorSpace;new GLTFLoader().load('assets/quaternius/fullbody/Superhero_Male_FullBody.gltf'"
          old_mesh="if(object.isMesh){object.castShadow=true;object.receiveShadow=true;object.frustumCulled=false}"
          new_mesh="if(object.isMesh){object.castShadow=true;object.receiveShadow=true;object.frustumCulled=false;if(object.material?.name?.toLowerCase().includes('superhero')){object.material=object.material.clone();object.material.map=neutralTexture;object.material.normalMap=null;object.material.roughness=.92;object.material.metalness=0;object.material.needsUpdate=true}}"
          old_scale="model.scale.setScalar(2/height);"
          new_scale="const scale=2/height;model.scale.set(scale*.84,scale,scale*.90);"
          for old,new in ((old_loader,new_loader),(old_mesh,new_mesh),(old_scale,new_scale)):
              if old not in text: raise SystemExit('PATCH_PATTERN_NOT_FOUND: '+old[:80])
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          git config user.name epaule-v5-render
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add src/app-v4.js
          git commit -m 'fix: render a neutral less muscular body'
          git push origin HEAD:agent/human-v4-quaternius
