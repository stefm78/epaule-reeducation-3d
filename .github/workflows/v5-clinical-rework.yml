name: Expose V5 contact landmarks
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v5-clinical-rework.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - name: Expose finger contacts and mesh floor height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/app-v4.js')
          text=path.read_text()
          old="const center=currentModelCenter(new THREE.Vector3()),jointNames=['upperarm_l','hand_l','upperarm_r','hand_r','calf_l','foot_l','ball_l','calf_r','foot_r','ball_r'],joints={};for(const name of jointNames)joints[name]=wp(name).toArray();return{ready,exercise:EXERCISES[current].id,supportMode,camera:{panEnabled:controls.enablePan,target:controls.target.toArray(),center:center.toArray(),distanceToCenter:controls.target.distanceTo(center),distance:camera.position.distanceTo(controls.target)},joints}"
          new="const center=currentModelCenter(new THREE.Vector3()),jointNames=['upperarm_l','hand_l','middle_01_l','upperarm_r','hand_r','middle_01_r','calf_l','foot_l','ball_l','calf_r','foot_r','ball_r'],joints={};for(const name of jointNames)joints[name]=wp(name).toArray();const meshMinY=new THREE.Box3().setFromObject(model).min.y;return{ready,exercise:EXERCISES[current].id,supportMode,meshMinY,camera:{panEnabled:controls.enablePan,target:controls.target.toArray(),center:center.toArray(),distanceToCenter:controls.target.distanceTo(center),distance:camera.position.distanceTo(controls.target)},joints}"
          if old not in text: raise SystemExit('DIAGNOSTICS_PATTERN_NOT_FOUND')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name epaule-v5-qa
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add src/app-v4.js
          git commit -m 'test: expose anatomical contact landmarks'
          git push origin HEAD:agent/human-v4-quaternius
