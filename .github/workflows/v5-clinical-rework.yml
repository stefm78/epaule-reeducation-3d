name: Correct V5 physical contact QA
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v5-clinical-rework.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - name: Test physical mesh contact rather than bone-centre height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('qa/v4-browser.mjs')
          text=path.read_text()
          old="""const kneeGroundError = maximumAbsolute(
  kneeDiagnostics.joints.calf_l[1] - 0.025,
  kneeDiagnostics.joints.calf_r[1] - 0.025,
  kneeDiagnostics.joints.middle_01_l[1] - 0.018,
  kneeDiagnostics.joints.middle_01_r[1] - 0.018
);
const toeGroundError = maximumAbsolute(
  toeDiagnostics.joints.ball_l[1] - 0.025,
  toeDiagnostics.joints.ball_r[1] - 0.025,
  toeDiagnostics.joints.middle_01_l[1] - 0.018,
  toeDiagnostics.joints.middle_01_r[1] - 0.018
);"""
          new="""const kneeGroundError = maximumAbsolute(
  kneeDiagnostics.joints.calf_l[1] - 0.025,
  kneeDiagnostics.joints.calf_r[1] - 0.025
);
const toeGroundError = Math.abs(toeDiagnostics.meshMinY);"""
          if old not in text: raise SystemExit('GROUND_ERROR_BLOCK_NOT_FOUND')
          text=text.replace(old,new,1)
          old_test="if (toeGroundError > 0.07) throw new Error(`Toe support is not grounded: ${toeGroundError}`);"
          new_test="if (toeGroundError > 0.07) throw new Error(`Toe-support mesh is not grounded: ${toeGroundError}`);"
          if old_test not in text: raise SystemExit('TOE_TEST_NOT_FOUND')
          path.write_text(text.replace(old_test,new_test,1))
          PY
          git config user.name epaule-v5-qa
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add qa/v4-browser.mjs
          git commit -m 'test: validate physical mesh floor contact'
          git push origin HEAD:agent/human-v4-quaternius
