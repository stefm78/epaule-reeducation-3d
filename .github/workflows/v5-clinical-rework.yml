name: Use precise skinned contact bounds
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v5-clinical-rework.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - name: Compute the deformed mesh bounds in QA diagnostics
        run: |
          python3 -c "from pathlib import Path; p=Path('src/app-v4.js'); s=p.read_text(); old='new THREE.Box3().setFromObject(model).min.y'; assert old in s; p.write_text(s.replace(old,'new THREE.Box3().setFromObject(model,true).min.y',1))"
          git config user.name epaule-v5-qa
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add src/app-v4.js
          git commit -m 'test: use precise skinned mesh contact bounds'
          git push origin HEAD:agent/human-v4-quaternius
