name: Acquire Quaternius CC0 human

on:
  push:
    branches: [agent/human-v2-asset-lab]
    paths: [.github/workflows/itch-human.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v2-asset-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download and select one CC0 human
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quaternius assets/quaternius research/itch-human
          mkdir -p /tmp/quaternius assets/quaternius research/itch-human
          cat > /tmp/acquire_itch.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, traceback

          report=[]
          target=Path('/tmp/quaternius/standard.zip')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              ctx=browser.new_context(accept_downloads=True, viewport={'width':1280,'height':900})
              page=ctx.new_page()
              page.on('request',lambda r: report.append({'request':r.method,'url':r.url}) if any(x in r.url.lower() for x in ['download','upload','511124','.zip']) else None)
              page.on('response',lambda r: report.append({'response':r.status,'url':r.url}) if any(x in r.url.lower() for x in ['download','upload','511124','.zip']) else None)
              try:
                  page.goto('https://quaternius.itch.io/universal-base-characters/purchase',wait_until='domcontentloaded',timeout=120000)
                  free=page.get_by_text('No thanks, just take me to the downloads',exact=False)
                  free.first.click()
                  page.wait_for_url('**/download/**',timeout=120000)
                  page.wait_for_load_state('domcontentloaded')
                  page.wait_for_timeout(2500)
                  btn=page.locator('#game_download_511124 .download_btn')
                  if not btn.count():btn=page.locator('[data-upload_id="511124"]')
                  if not btn.count():btn=page.get_by_text('Download',exact=True)
                  report.append({'stage':'button','count':btn.count(),'html':btn.first.evaluate('(e)=>e.outerHTML') if btn.count() else None,'url':page.url})
                  if not btn.count():raise RuntimeError('Exact itch download button not found')
                  with page.expect_download(timeout=180000) as info:
                      btn.first.click(force=True)
                  d=info.value
                  d.save_as(str(target))
                  report.append({'stage':'download','name':d.suggested_filename,'bytes':target.stat().st_size,'url':d.url})
              except Exception as exc:
                  report.append({'stage':'error','error':repr(exc),'traceback':traceback.format_exc(),'url':page.url})
                  page.screenshot(path='research/itch-human/error.png',full_page=True)
              finally:
                  browser.close()
          Path('research/itch-human/browser.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if not target.exists():raise SystemExit('DOWNLOAD_FAILED')
          PY
          python /tmp/acquire_itch.py
          unzip -l /tmp/quaternius/standard.zip > research/itch-human/package-list.txt
          unzip -q /tmp/quaternius/standard.zip -d /tmp/quaternius/unpacked
          find /tmp/quaternius/unpacked -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.obj' \) -printf '%P\t%s\n' | sort > research/itch-human/models.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json
          root=Path('/tmp/quaternius/unpacked')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.glb','.gltf','.fbx'}]
          def score(p):
              n=str(p).lower()
              s=0
              if p.suffix.lower()=='.glb':s+=100
              if p.suffix.lower()=='.gltf':s+=80
              if 'male' in n or 'man' in n:s+=30
              if 'base' in n or 'character' in n:s+=20
              if 'animation' in n or 'anim' in n:s-=20
              if 'unreal' in n or 'unity' in n:s-=10
              s-=p.stat().st_size/100_000_000
              return s
          files.sort(key=score,reverse=True)
          if not files:raise SystemExit('NO_MODEL_FILES')
          chosen=files[0]
          out=Path('assets/quaternius')
          out.mkdir(parents=True,exist_ok=True)
          if chosen.suffix.lower()=='.gltf':
              parent=chosen.parent
              shutil.copytree(parent,out/'source',dirs_exist_ok=True)
              rel='source/'+chosen.name
          else:
              shutil.copy2(chosen,out/('human'+chosen.suffix.lower()))
              rel='human'+chosen.suffix.lower()
          Path('research/itch-human/selection.json').write_text(json.dumps({'chosen':str(chosen.relative_to(root)),'bytes':chosen.stat().st_size,'published':rel,'candidates':[str(p.relative_to(root)) for p in files[:30]]},indent=2))
          PY
          cat > assets/quaternius/LICENSE.md <<'EOF'
          # Universal Base Characters — Quaternius

          Source: https://quaternius.com/packs/universalbasecharacters.html

          License stated by the author: CC0 1.0 Universal / public domain dedication.
          The selected model is redistributed and adapted for this shoulder-rehabilitation visualisation.
          EOF
          du -sh assets/quaternius
          find assets/quaternius -type f -printf '%P\t%s bytes\n' | sort > research/itch-human/published-inventory.txt
      - name: Commit selected model and evidence
        run: |
          git config user.name 'epaule-3d-asset-lab'
          git config user.email '104558808+stefm78@users.noreply.github.com'
          git add assets/quaternius research/itch-human
          git commit -m 'feat: acquire selected Quaternius CC0 human model'
          git push origin HEAD:agent/human-v2-asset-lab
      - uses: actions/upload-artifact@v4
        with:
          name: quaternius-human-selection
          path: |
            assets/quaternius
            research/itch-human
