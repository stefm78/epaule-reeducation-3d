name: Publish validated V5 clinical PWA
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [release/publish-v5.txt]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact validated bundle
        working-directory: source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:v4
          test -s app-v4.bundle.js
          test -s assets/quaternius/fullbody/Regular_Male_FullBody.gltf
      - name: Assemble minimal public application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/assets/quaternius/fullbody release/icons
          cp source/index-v4.html release/index.html
          cp source/styles-v4.css source/app-v4.bundle.js source/pwa.js source/manifest.webmanifest release/
          cp source/icons/icon.svg source/icons/icon-192.png source/icons/icon-512.png release/icons/
          cp source/assets/quaternius/fullbody/* release/assets/quaternius/fullbody/
          touch release/.nojekyll
          cat > release/sw.js <<'EOF'
          const CACHE='epaule-v5-clinical-1';
          const SHELL=['./','./index.html','./styles-v4.css','./app-v4.bundle.js','./pwa.js','./manifest.webmanifest','./icons/icon.svg','./icons/icon-192.png','./icons/icon-512.png'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(SHELL)));self.skipWaiting()});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))));self.clients.claim()});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(response=>{const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy));return response}).catch(()=>caches.match('./index.html'))))});
          EOF
          cat > release/README.md <<'EOF'
          # Épaule 3D

          PWA personnelle de mémorisation et de discussion des exercices avec le kinésithérapeute traitant.

          Le modèle humain neutre provient de Universal Base Characters par Quaternius, diffusé sous CC0 1.0 Universal.

          La séquence repose sur des principes publiés de rééducation active, de contrôle scapulaire et de progression de charge. Elle ne constitue pas une prescription clinique individuelle.
          EOF
      - uses: actions/checkout@v4
        with:
          ref: main
          path: public
      - name: Replace public site with the validated candidate
        shell: bash
        run: |
          set -euo pipefail
          find public -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a release/. public/
          cd public
          git config user.name epaule-v5-release
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add -A
          git commit -m 'release: publish clinically reworked V5 rehabilitation PWA'
          git push origin HEAD:main
