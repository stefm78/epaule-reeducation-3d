name: V5 clinical product build and QA
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths:
      - package.json
      - src/**
      - qa/**
      - index-v4.html
      - styles-v4.css
      - pwa.js
      - manifest.webmanifest
      - icons/**
      - assets/quaternius/fullbody/**
      - .github/workflows/v4-product.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v4-quaternius
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npm run build:v4
          rm -rf candidate qa-output
          mkdir -p candidate/assets/quaternius/fullbody candidate/icons
          cp index-v4.html candidate/index.html
          cp styles-v4.css candidate/styles-v4.css
          cp app-v4.bundle.js pwa.js manifest.webmanifest candidate/
          cp icons/icon-192.png icons/icon-512.png icons/icon.svg candidate/icons/
          cp assets/quaternius/fullbody/* candidate/assets/quaternius/fullbody/
          cat > candidate/sw.js <<'EOF'
          const CACHE='epaule-v5-clinical-1';
          const SHELL=['./','./index.html','./styles-v4.css','./app-v4.bundle.js','./pwa.js','./manifest.webmanifest','./icons/icon.svg','./icons/icon-192.png','./icons/icon-512.png'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(SHELL)));self.skipWaiting()});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))));self.clients.claim()});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(response=>{const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy));return response}).catch(()=>caches.match('./index.html'))))});
          EOF
          test -s candidate/app-v4.bundle.js
          test -s candidate/assets/quaternius/fullbody/Regular_Male_FullBody.gltf
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and biomechanical QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory candidate > /tmp/v5-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4173/ node qa/v4-browser.mjs
      - name: Verify generated bundle
        run: test -s app-v4.bundle.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-clinical-product-evidence
          path: |
            candidate
            qa-output
          if-no-files-found: error
