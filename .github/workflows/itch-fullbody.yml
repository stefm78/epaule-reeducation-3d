name: Acquire exact Quaternius full body
on:
  push:
    branches: [agent/human-v2-asset-lab]
    paths: [.github/workflows/itch-fullbody.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v2-asset-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download exact full-body model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qfull assets/quaternius/fullbody research/itch-fullbody
          mkdir -p /tmp/qfull assets/quaternius/fullbody research/itch-fullbody
          cat >/tmp/download.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          report=[]; z=Path('/tmp/qfull/standard.zip')
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True);c=b.new_context(accept_downloads=True);p=c.new_page()
            p.goto('https://quaternius.itch.io/universal-base-characters/purchase',wait_until='domcontentloaded',timeout=120000)
            p.get_by_text('No thanks, just take me to the downloads',exact=False).first.click()
            p.wait_for_url('**/download/**',timeout=120000);p.wait_for_timeout(1800)
            btn=p.locator('#game_download_511124 .download_btn')
            with p.expect_download(timeout=180000) as info:btn.click(force=True)
            d=info.value;d.save_as(str(z));report.append({'filename':d.suggested_filename,'bytes':z.stat().st_size,'url':d.url})
            b.close()
          Path('research/itch-fullbody/download.json').write_text(json.dumps(report,indent=2))
          PY
          python /tmp/download.py
          unzip -q /tmp/qfull/standard.zip -d /tmp/qfull/unpacked
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil
          root=Path('/tmp/qfull/unpacked')
          matches=list(root.rglob('Superhero_Male_FullBody.gltf'))
          matches=[p for p in matches if 'Godot - UE' in str(p)] or matches
          if not matches:raise SystemExit('FULL_BODY_NOT_FOUND')
          src=matches[0]; data=json.loads(src.read_text())
          out=Path('assets/quaternius/fullbody');out.mkdir(parents=True,exist_ok=True)
          shutil.copy2(src,out/src.name)
          deps=[]
          for group in ('buffers','images'):
            for item in data.get(group,[]):
              uri=item.get('uri','')
              if uri and not uri.startswith('data:'):
                f=(src.parent/uri).resolve();dest=out/uri;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(f,dest);deps.append(uri)
          report={'source':str(src.relative_to(root)),'gltf_bytes':src.stat().st_size,'dependencies':deps,'published_bytes':sum(p.stat().st_size for p in out.rglob('*') if p.is_file())}
          Path('research/itch-fullbody/selection.json').write_text(json.dumps(report,indent=2))
          PY
          cat > assets/quaternius/fullbody/LICENSE.md <<'EOF'
          Universal Base Characters by Quaternius — CC0 1.0 Universal.
          Source: https://quaternius.com/packs/universalbasecharacters.html
          Selected asset: Superhero_Male_FullBody.gltf.
          EOF
          find assets/quaternius/fullbody -type f -printf '%P\t%s bytes\n' | sort > research/itch-fullbody/inventory.txt
          du -sh assets/quaternius/fullbody
      - name: Commit exact asset
        run: |
          git config user.name epaule-3d-asset-lab
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add assets/quaternius/fullbody research/itch-fullbody
          git commit -m 'feat: select Quaternius CC0 full-body human'
          git push origin HEAD:agent/human-v2-asset-lab
      - uses: actions/upload-artifact@v4
        with:
          name: quaternius-fullbody
          path: |
            assets/quaternius/fullbody
            research/itch-fullbody
