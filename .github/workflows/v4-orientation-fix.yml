name: Final V4 camera correction
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v4-orientation-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/human-v4-quaternius}
      - name: Frame each movement for immediate readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-v4.js');s=p.read_text()
          old="function frameCurrent(){const isSupine=EX[current].id==='supine';camera.position.set(4.2,2.15,isSupine?-.35:.95);controls.target.set(0,.58,isSupine?-.78:.82);controls.update()}"
          new="function frameCurrent(){const id=EX[current].id;if(id==='supine'){camera.position.set(4.8,2.8,-.45);controls.target.set(0,.42,-.35)}else if(id==='airplane'){camera.position.set(3.2,2.25,-3.2);controls.target.set(0,.62,.72)}else if(id==='dive'){camera.position.set(5.4,2.35,.95);controls.target.set(0,.52,.62)}else{camera.position.set(4.4,2.15,.95);controls.target.set(0,.58,.82)}controls.update()}"
          if old not in s: raise SystemExit('FRAME_FUNCTION_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name epaule-v4-correction
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add src/app-v4.js
          git commit -m 'fix: frame airplane and dive movements clearly'
          git push origin HEAD:agent/human-v4-quaternius
