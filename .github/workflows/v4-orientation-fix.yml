name: V4 final range correction
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v4-orientation-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/human-v4-quaternius}
      - name: Keep dive translation within kneeling reach
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-v4.js');s=p.read_text()
          changes={
          "camera.position.set(1.5,2.45,-5.2)":"camera.position.set(1.2,2.25,-4.25)",
          "z=.16+.62*a":"z=.16+.34*a",
          "z=.78;b=.78*(1-a)":"z=.50;b=.78*(1-a)",
          "z=.78-.73*a":"z=.50-.45*a"
          }
          for old,new in changes.items():
              if old not in s: raise SystemExit('MISSING_PATTERN: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name epaule-v4-correction
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add src/app-v4.js
          git commit -m 'fix: preserve knee contact through dive translation'
          git push origin HEAD:agent/human-v4-quaternius
