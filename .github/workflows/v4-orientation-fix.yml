name: Repair V4 reset handler
on:
  push:
    branches: [agent/human-v4-quaternius]
    paths: [.github/workflows/v4-orientation-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/human-v4-quaternius}
      - name: Repair malformed reset handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-v4.js');s=p.read_text()
          old="$('#resetView').onclick=frameCurrent;controls.target.set(0,.72,-.65)};"
          if old not in s: raise SystemExit('MALFORMED_HANDLER_NOT_FOUND')
          p.write_text(s.replace(old,"$('#resetView').onclick=frameCurrent;",1))
          PY
          git config user.name epaule-v4-correction
          git config user.email 104558808+stefm78@users.noreply.github.com
          git add src/app-v4.js
          git commit -m 'fix: repair reset view handler syntax'
          git push origin HEAD:agent/human-v4-quaternius
