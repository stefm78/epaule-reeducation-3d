name: Poly human asset probe

on:
  push:
    branches:
      - agent/human-v2-asset-lab
    paths:
      - .github/workflows/poly-asset.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-v2-asset-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download CC0 animated human
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/poly assets/human
          cat > /tmp/poly.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, traceback

          report=[]
          target=Path('assets/human/animated-human.glb')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              ctx=browser.new_context(accept_downloads=True, viewport={'width':1280,'height':900})
              page=ctx.new_page()
              page.on('response', lambda r: report.append({'response':r.status,'url':r.url}) if any(x in r.url.lower() for x in ['.glb','.gltf','.zip','download','storage','firebase']) else None)
              try:
                  page.goto('https://poly.pizza/m/c3Ibh9I3udk', wait_until='networkidle', timeout=120000)
                  page.screenshot(path='research/poly/01-model.png', full_page=True)
                  report.append({'stage':'model','url':page.url,'body':page.locator('body').inner_text()[:12000]})
                  buttons=page.get_by_text('Download', exact=True)
                  if not buttons.count(): buttons=page.get_by_text('Download', exact=False)
                  buttons.first.click()
                  page.wait_for_timeout(2500)
                  page.screenshot(path='research/poly/02-after-download.png', full_page=True)
                  report.append({'stage':'after-click','url':page.url,'body':page.locator('body').inner_text()[:12000]})
                  choices=page.get_by_text('GLTF', exact=False)
                  if choices.count():
                      with page.expect_download(timeout=120000) as info:
                          choices.first.click()
                      d=info.value
                  else:
                      with page.expect_download(timeout=120000) as info:
                          page.get_by_text('Download', exact=False).last.click()
                      d=info.value
                  tmp=Path('/tmp')/(d.suggested_filename or 'human-download')
                  d.save_as(str(tmp))
                  report.append({'stage':'download','name':tmp.name,'bytes':tmp.stat().st_size})
                  if tmp.suffix.lower()=='.glb':
                      target.write_bytes(tmp.read_bytes())
                  elif tmp.suffix.lower()=='.zip':
                      import zipfile
                      with zipfile.ZipFile(tmp) as z:
                          names=[n for n in z.namelist() if n.lower().endswith('.glb')]
                          if names: target.write_bytes(z.read(names[0]))
                          else:
                              z.extractall('assets/human/source')
                  else:
                      target.with_suffix(tmp.suffix).write_bytes(tmp.read_bytes())
              except Exception as exc:
                  report.append({'stage':'error','error':repr(exc),'traceback':traceback.format_exc(),'url':page.url})
                  try: page.screenshot(path='research/poly/99-error.png', full_page=True)
                  except Exception: pass
              finally:
                  browser.close()
          Path('research/poly/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/poly.py
          find assets/human -type f -printf '%P\t%s bytes\n' | sort > research/poly/inventory.txt
      - name: Commit acquired asset and evidence
        run: |
          git config user.name 'epaule-3d-asset-lab'
          git config user.email '104558808+stefm78@users.noreply.github.com'
          git add assets/human research/poly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: acquire CC0 rigged human asset'
          git push origin HEAD:agent/human-v2-asset-lab
